name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 || secrets.KEYSTORE_B64 || vars.KEYSTORE_B64 || secrets.KEYSTORE }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD || secrets.STORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS || secrets.ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD || secrets.STORE_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        run: |
          # GitHub 的 ubuntu-22.04 镜像已内置 Android SDK（含 android-34 / build-tools 34.0.0）
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          echo "--- platforms ---"
          ls "$SDK/platforms" || true
          echo "--- build-tools ---"
          ls "$SDK/build-tools" || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing config
        id: sign
        run: |
          echo "KEYSTORE_BASE64 长度: ${#KEYSTORE_BASE64}"
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "suffix=-unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::没有读到 KEYSTORE_BASE64。请在 Settings -> Secrets and variables -> Actions 的 Secrets 页签新建，名字必须是 KEYSTORE_BASE64"
            exit 0
          fi
          echo "开头 8 位: ${KEYSTORE_BASE64:0:8}"
          echo "结尾 8 位: ${KEYSTORE_BASE64: -8}"
          echo "KEYSTORE_PASSWORD 为空? $([ -z "$KEYSTORE_PASSWORD" ] && echo 是 || echo 否)"
          echo "KEY_ALIAS: ${KEY_ALIAS:-<空>}"
          python3 - <<'PY'
          import base64, os, pathlib, re
          raw = os.environ.get('KEYSTORE_BASE64', '')
          cleaned = re.sub(r'[^A-Za-z0-9+/=_-]', '', raw)
          print('原始长度:', len(raw), '| 清洗后长度:', len(cleaned))
          ok = False
          try:
              s = cleaned.replace('-', '+').replace('_', '/')
              s += '=' * (-len(s) % 4)
              data = base64.b64decode(s, validate=True)
              head = data[:4]
              print('解码字节数:', len(data), '| 文件头:', head.hex())
              if head == b'\xfe\xed\xfe\xed' or data[:1] == b'\x30':
                  pathlib.Path('keystore').mkdir(exist_ok=True)
                  pathlib.Path('keystore/release.keystore').write_bytes(data)
                  ok = True
              else:
                  print('文件头不是 JKS / PKCS12，可能不是 keystore 文件')
          except Exception as exc:
              print('base64 解码失败:', exc)
              print('前 40 个字符:', repr(raw[:40]))
          pathlib.Path('.sign_ok').write_text('1' if ok else '0')
          PY
          if [ "$(cat .sign_ok)" = "1" ]; then
            printf 'storeFile=../keystore/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            if keytool -list -keystore keystore/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "suffix=-signed" >> "$GITHUB_OUTPUT"
              echo "keystore 校验通过，将输出已签名 APK"
            else
              echo "suffix=-unsigned" >> "$GITHUB_OUTPUT"
              echo "::warning::keystore 密码或别名不正确，本次产出未签名 APK"
              rm -f keystore.properties
            fi
          else
            echo "suffix=-unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 无法解码（长度 ${#KEYSTORE_BASE64}，开头 ${KEYSTORE_BASE64:0:8}，结尾 ${KEYSTORE_BASE64: -8}），本次产出未签名 APK"
          fi

      - name: Resolve version
        id: ver
        run: |
          echo "code=$(date -u +%y%m%d%H)" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: |
          ARGS="-PversionCode=${{ steps.ver.outputs.code }}"
          if [[ -n "${{ steps.ver.outputs.name }}" ]]; then
            ARGS="$ARGS -PversionName=${{ steps.ver.outputs.name }}"
          fi
          gradle assembleRelease --no-daemon --stacktrace $ARGS

      - name: Generate release update metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          RELEASE_TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime, json, os
          metadata = {
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": os.environ["VERSION_NAME"],
              "changelog": "QY-FM 自动升级版本。请查看 GitHub Release 说明了解本次更新内容。",
              "downloadUrl": f"https://github.com/{os.environ['REPOSITORY']}/releases/download/{os.environ['RELEASE_TAG']}/app-release.apk",
              "forceUpdate": False,
              "releaseDate": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
          }
          with open("version.json", "w", encoding="utf-8") as f:
              json.dump(metadata, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY

      - name: Verify APK signature
        id: signstate
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          ls -l app/build/outputs/apk/release/
          BT="$(ls -d ${ANDROID_SDK_ROOT}/build-tools/* | sort -V | tail -1)"
          if "$BT/apksigner" verify --print-certs "$APK" 2>&1 | tee apksigner.txt; then
            echo "state=-signed" >> "$GITHUB_OUTPUT"
            echo "::notice::APK 签名校验通过"
            grep -m1 'certificate DN' apksigner.txt || true
          else
            echo "state=-unsigned" >> "$GITHUB_OUTPUT"
            echo "::error::APK 未签名，装不上。请检查 KEYSTORE_BASE64（长度应为 3592）、KEYSTORE_PASSWORD、KEY_ALIAS、KEY_PASSWORD"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-apk-${{ github.run_number }}${{ steps.signstate.outputs.state }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.signstate.outputs.state == '-signed'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            version.json
          generate_release_notes: true
