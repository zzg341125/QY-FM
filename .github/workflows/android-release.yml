name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configure Android SDK
        run: |
          # GitHub 的 ubuntu-22.04 镜像已内置 Android SDK（含 android-34 / build-tools 34.0.0）
          SDK="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          echo "--- platforms ---"
          ls "$SDK/platforms" || true
          echo "--- build-tools ---"
          ls "$SDK/build-tools" || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare signing config
        id: sign
        if: env.KEYSTORE_BASE64 != ''
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          raw = ''.join(os.environ.get('KEYSTORE_BASE64', '').split())
          ok = False
          try:
              raw = raw.replace('-', '+').replace('_', '/')
              raw += '=' * (-len(raw) % 4)
              data = base64.b64decode(raw, validate=True)
              head = data[:4]
              if head == b'\xfe\xed\xfe\xed' or data[:1] == b'\x30':
                  pathlib.Path('keystore').mkdir(exist_ok=True)
                  pathlib.Path('keystore/release.keystore').write_bytes(data)
                  print('keystore decoded bytes:', len(data))
                  ok = True
              else:
                  print('unexpected keystore header:', head)
          except Exception as exc:
              print('decode failed:', exc)
          pathlib.Path('.sign_ok').write_text('1' if ok else '0')
          PY
          if [ "$(cat .sign_ok)" = "1" ]; then
            printf 'storeFile=../keystore/release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            if keytool -list -keystore keystore/release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
              echo "suffix=" >> "$GITHUB_OUTPUT"
              echo "keystore 校验通过，将输出已签名 APK"
            else
              echo "suffix=-unsigned" >> "$GITHUB_OUTPUT"
              echo "::warning::keystore 密码或别名不正确，本次产出未签名 APK"
              rm -f keystore.properties
            fi
          else
            echo "suffix=-unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 无法解码，本次产出未签名 APK"
          fi

      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "code=$(date -u +%y%m%d%H)" >> "$GITHUB_OUTPUT"
          else
            echo "name=" >> "$GITHUB_OUTPUT"
            echo "code=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release APK
        run: |
          ARGS=""
          if [[ -n "${{ steps.ver.outputs.name }}" ]]; then
            ARGS="-PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ steps.ver.outputs.code }}"
          fi
          gradle assembleRelease --no-daemon --stacktrace $ARGS

      - name: Show APK
        run: |
          ls -l app/build/outputs/apk/release/
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          BT="$(ls -d ${ANDROID_SDK_ROOT}/build-tools/* | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs "$APK" || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: radio-apk-${{ github.run_number }}${{ steps.sign.outputs.suffix || '-unsigned' }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.sign.outputs.suffix != '-unsigned'
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true

      - name: Skip release (unsigned)
        if: startsWith(github.ref, 'refs/tags/') && steps.sign.outputs.suffix == '-unsigned'
        run: echo "::warning::未签名，已跳过 Release。请修复 KEYSTORE_BASE64 后重新 push tag"
